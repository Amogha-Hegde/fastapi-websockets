[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-websockets"
version = "0.1.0"
description = "Backend-agnostic WebSocket channel layers for FastAPI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["fastapi", "websocket", "channels", "redis", "pubsub", "messaging"]
authors = [
    { name = "Amogha Hegde" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Framework :: AsyncIO",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "fastapi>=0.110.0",
]

[project.urls]
Homepage = "https://github.com/Amogha-Hegde/fastapi-websockets"
Repository = "https://github.com/Amogha-Hegde/fastapi-websockets"
Issues = "https://github.com/Amogha-Hegde/fastapi-websockets/issues"

[project.optional-dependencies]
postgresql = [
    "asyncpg>=0.29.0",
]
redis = [
    "redis>=5.0.0",
]
nats = [
    "nats-py>=2.7.0",
]
rabbitmq = [
    "aio-pika>=9.4.0",
    "pika>=1.3.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[tool.setuptools.packages.find]
include = ["fastapi_websockets*"]

[tool.setuptools.package-data]
fastapi_websockets = [".agents/skills/*/SKILL.md"]
